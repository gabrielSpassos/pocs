name: Update Auto MD Index

# On any push to the repository, this workflow will run.
# on: [push]

on:
  push:
    paths:
      - 'auto-md-index-poc/**'

permissions:
  contents: write

jobs:
  auto-md-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: technote-space/toc-generator@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PATHS: 'auto-md-index-poc/README.md'
