name: Update Auto MD Index for Hoverfly

on:
  push:
    paths:
      - 'hoverfly/**'

permissions:
  contents: write

jobs:
  auto-md-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: technote-space/toc-generator@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PATHS: 'hoverfly/*.md'
